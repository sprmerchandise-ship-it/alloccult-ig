name: Reel Review Check

# Manual live test of the Claude Reel review: re-reviews a fresh copy of the
# first Reel in the newest queue and uploads the result. Changes nothing in
# the repo and posts nothing.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies & fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow numpy fonttools anthropic -q
          mkdir -p fonts
          curl -sL -o "fonts/Cinzel.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf"
          curl -sL -o "fonts/EBGaramond.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf"
      - name: Review one Reel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python reel_review.py "$(ls queue/????-??-??.json | sort | tail -1)" out/check --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-review-check
          path: out/check
          if-no-files-found: ignore
