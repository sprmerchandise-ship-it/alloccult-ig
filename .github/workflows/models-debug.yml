name: Pipeline check (temporary)

# Temporary: runs trends.py on a GitHub runner (Wikimedia is reachable there)
# and prints what it collected. Runs only on this branch. Removed before merge.
on:
  push:
    branches: [ccr-a6f75997-qmgmf3]
    paths: [".github/workflows/models-debug.yml", "trends.py"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ephem -q
      - name: trends.py
        run: |
          python trends.py "$(date -u +%F)"
          python - <<'PY'
          import json, glob
          t = json.load(open(sorted(glob.glob("trends/*.json"))[-1]))
          print("wikipedia:", len(t["wikipedia"]), [a["title"] for a in t["wikipedia"][:40]])
          print("calendar:", *t["calendar"], sep="\n  ")
          print("hashtag_top:", len(t["instagram"].get("hashtag_top", [])))
          PY
