name: Publish Reel Previews

# Puts the week's Reels on the `previews` branch so they can be watched straight
# from GitHub (open a .mp4 → "View raw"), with a contact sheet per Reel. The
# branch is replaced every time, so it never grows the repo.
#
# - After each successful Weekly Competitor Intel run: copies its posts bundle.
# - Manual run with a run ID: copies that run's bundle.
# - Manual run without a run ID: re-renders the newest queue/*.json (use this
#   after editing a queue file) and commits the chosen images back to it.

on:
  workflow_run:
    workflows: ["Weekly Competitor Intel"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Weekly Competitor Intel run ID to copy (leave empty to re-render the newest queue)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow numpy fonttools -q
          mkdir -p fonts
          curl -sL -o "fonts/Cinzel.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf"
          curl -sL -o "fonts/EBGaramond.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf"

      - name: Download posts bundle
        if: env.RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          pattern: posts-*
          path: bundle
          merge-multiple: true
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Re-render newest queue
        if: env.RUN_ID == ''
        run: |
          Q=$(ls queue/????-??-??.json | sort | tail -1)
          python render_reel.py "$Q" all bundle
          git config user.name "alloccult-bot"
          git config user.email "bot@alloccult.com"
          git add "$Q"
          git diff --cached --quiet || git commit -m "Re-render previews: $Q"
          git pull --rebase
          git push

      - name: Contact sheets
        run: |
          cd bundle
          for f in *.mp4; do
            ffmpeg -loglevel error -y -i "$f" \
              -vf "fps=1/4,scale=270:480,tile=6x1" -frames:v 1 "${f%.mp4}_sheet.jpg"
          done
          ls -la

      - name: Push to previews branch
        run: |
          cd bundle
          git init -q -b previews
          git config user.name "alloccult-bot"
          git config user.email "bot@alloccult.com"
          git add -A
          git commit -qm "Reel previews (${RUN_ID:-re-render})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews
