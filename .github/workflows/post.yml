name: ALLOCCULT Instagram Post

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      prepare_only:
        description: "Write + review the next carousel, but don't post it"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & fonts
        run: |
          pip install pillow numpy fonttools anthropic -q
          mkdir -p fonts
          curl -sL -o "fonts/Cinzel.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf"
          curl -sL -o "fonts/EBGaramond.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf"

      - name: Publish post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}   # optional: keystring:shared_secret
          GH_PAT: ${{ secrets.GH_PAT }}               # reads archive page text for fact-checking
        run: python post.py ${{ inputs.prepare_only && '--prepare' || '' }}

      - name: Save posting history and drafts
        if: always()      # keep review logs even if a step failed
        run: |
          git config user.name "alloccult-bot"
          git config user.email "bot@alloccult.com"
          git add state.json
          [ -e published.json ] && git add published.json
          git add drafts
          git diff --cached --quiet || git commit -m "Update posting state"
          git pull --rebase
          git push
