name: ALLOCCULT Instagram Post

on:
  schedule:
    # Three tries a day (off the hour: :00 runs start hours late). Only the first
    # that succeeds posts; the rest see today's post and stop. The extra tries are
    # for the free Gemini tier, which is often overloaded for hours.
    - cron: "43 13 * * *"
    - cron: "43 17 * * *"
    - cron: "43 21 * * *"
  workflow_dispatch:
    inputs:
      prepare_only:
        description: "Write + review the next carousel, but don't post it"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:          # never two jobs editing drafts/ at once
  group: drafts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies & fonts
        run: |
          pip install pillow numpy fonttools anthropic -q
          mkdir -p fonts
          curl -sL -o "fonts/Cinzel.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf"
          curl -sL -o "fonts/EBGaramond.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf"

      - name: Publish post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}        # free AI (llm.py); or:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # paid AI (llm.py)
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FAST_MODEL: ${{ vars.LLM_FAST_MODEL }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}   # optional: keystring:shared_secret
          GH_PAT: ${{ secrets.GH_PAT }}               # reads archive page text for fact-checking
        run: python post.py ${{ inputs.prepare_only && '--prepare' || '' }}

      - name: Save posting history and drafts
        if: always()      # keep review logs even if a step failed
        run: |
          git config user.name "alloccult-bot"
          git config user.email "bot@alloccult.com"
          git add state.json
          [ -e published.json ] && git add published.json
          git add drafts
          git diff --cached --quiet || git commit -m "Update posting state"
          git pull --rebase
          git push
