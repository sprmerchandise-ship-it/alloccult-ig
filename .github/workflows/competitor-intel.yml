name: Weekly Competitor Intel

on:
  schedule:
    - cron: "47 7 * * 1"   # Mondays ~07:47 UTC, after maintenance (off the hour: :00 runs start hours late)
    - cron: "47 7 * * 3"   # Wednesdays: a second chance if Monday's plan failed (skips if planned)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"                                # timestamped logs
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}        # free AI (llm.py); or:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # paid AI (llm.py)
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_FAST_MODEL: ${{ vars.LLM_FAST_MODEL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache depth model (motion.py)
        uses: actions/cache@v5
        with:
          path: models
          key: depth-anything-v2-vits

      - name: Install dependencies & fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow numpy fonttools opencv-python-headless onnxruntime anthropic ephem -q
          mkdir -p fonts
          curl -sL -o "fonts/Cinzel.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf"
          curl -sL -o "fonts/EBGaramond.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf"
          echo "DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Scan competitor accounts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        # If Instagram refuses (e.g. its hourly API limit), plan from the last scan.
        run: |
          python competitor_scan.py || echo "::warning::Competitor scan failed — planning from the last scan ($(python3 -c 'import json; print(json.load(open("competitors/scan.json"))["generated"])'))."

      - name: Collect trends (Wikipedia, sky + folk calendar, hashtags)
        run: python trends.py "$DATE"

      - name: Write competitor report
        run: |
          # The plan matters more than the report: carry on without it if the AI fails.
          python intel_report.py "$DATE" || echo "::warning::No competitor report this time; planning without it."

      - name: Plan the week (4 Reels + 3 carousels)
        run: |
          python planner.py "$DATE"
          if [ -f "reports/$DATE.md" ]; then cat "reports/$DATE.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Turn the 4 planned Reels into specs
        run: python compose_posts.py

      - name: Render + review the week's Reels (preview bundle)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          Q=$(ls queue/????-??-??.json 2>/dev/null | sort | tail -1)
          if [ -n "$Q" ]; then
            python reel_review.py "$Q" "out/posts-$DATE"     # reviews only Reels not yet reviewed
          else
            echo "No Reel queue."
          fi

      - name: Upload posts bundle
        uses: actions/upload-artifact@v6
        with:
          name: posts-${{ env.DATE }}
          path: out/posts-${{ env.DATE }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit scan, trends, report, plan + queue
        if: always()   # keep what was made even if a later step failed
        run: |
          git config user.name "alloccult-bot"
          git config user.email "bot@alloccult.com"
          for f in competitors/scan.json trends reports plan queue; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Weekly intel, trends + content plan: $DATE"
          git pull --rebase
          git push
