name: Weekly Competitor Intel

on:
  schedule:
    - cron: "0 8 * * 1"   # every Monday 08:00 UTC (after maintenance refreshes insights)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies & fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow numpy fonttools -q
          mkdir -p fonts
          curl -sL -o "fonts/Cinzel.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf"
          curl -sL -o "fonts/EBGaramond.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf"

      - name: Scan competitor accounts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python competitor_scan.py

      - name: Write report with Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          DATE=$(date -u +%F)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          claude -p "$(sed "s/{{DATE}}/$DATE/g" intel/analysis_prompt.md)" \
            --allowedTools "Read,Glob,Grep,Write" \
            --permission-mode acceptEdits
          test -s "reports/$DATE.md" || { echo "Claude did not write reports/$DATE.md"; exit 1; }
          cat "reports/$DATE.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Turn the 7 Reel scripts into specs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python compose_posts.py

      - name: Render + Claude-review the week's Reels (preview bundle)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          pip install anthropic -q
          if [ -f "queue/$DATE.json" ]; then
            python reel_review.py "queue/$DATE.json" "out/posts-$DATE"
          else
            echo "No new queue this week (previous one still posting)."
          fi

      - name: Upload posts bundle
        uses: actions/upload-artifact@v4
        with:
          name: posts-${{ env.DATE }}
          path: out/posts-${{ env.DATE }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit scan, report + queue
        if: always()   # keep the report even if composing/rendering failed
        run: |
          git config user.name "alloccult-bot"
          git config user.email "bot@alloccult.com"
          for f in competitors/scan.json "reports/$DATE.md" "queue/$DATE.json"; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "Weekly competitor intel + reel queue: $DATE"
          git pull --rebase
          git push
