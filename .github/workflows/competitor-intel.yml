name: Weekly Competitor Intel

on:
  schedule:
    - cron: "47 7 * * 1"   # Mondays ~07:47 UTC, after maintenance (off the hour: :00 runs start hours late)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}        # free AI (llm.py); or:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # paid AI (llm.py)
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_FAST_MODEL: ${{ vars.LLM_FAST_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache depth model (motion.py)
        uses: actions/cache@v4
        with:
          path: models
          key: depth-anything-v2-vits

      - name: Install dependencies & fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow numpy fonttools opencv-python-headless onnxruntime anthropic ephem -q
          mkdir -p fonts
          curl -sL -o "fonts/Cinzel.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf"
          curl -sL -o "fonts/EBGaramond.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf"
          echo "DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Scan competitor accounts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python competitor_scan.py

      - name: Collect trends (Wikipedia, sky + folk calendar, hashtags)
        run: python trends.py "$DATE"

      - name: Write competitor report
        run: |
          python intel_report.py "$DATE"
          test -s "reports/$DATE.md" || { echo "No report written to reports/$DATE.md"; exit 1; }

      - name: Plan the week (4 Reels + 3 carousels)
        run: |
          python planner.py "$DATE"
          cat "reports/$DATE.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Turn the 4 planned Reels into specs
        run: python compose_posts.py

      - name: Render + review the week's Reels (preview bundle)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -f "queue/$DATE.json" ]; then
            python reel_review.py "queue/$DATE.json" "out/posts-$DATE"
          else
            echo "No Reel queue this week."
          fi

      - name: Upload posts bundle
        uses: actions/upload-artifact@v4
        with:
          name: posts-${{ env.DATE }}
          path: out/posts-${{ env.DATE }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit scan, trends, report, plan + queue
        if: always()   # keep what was made even if a later step failed
        run: |
          git config user.name "alloccult-bot"
          git config user.email "bot@alloccult.com"
          for f in competitors/scan.json "trends/$DATE.json" "reports/$DATE.md" "plan/$DATE.json" "queue/$DATE.json"; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Weekly intel, trends + content plan: $DATE"
          git pull --rebase
          git push
