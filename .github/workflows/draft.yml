name: Render Carousel Drafts

# Renders every carousel draft that hasn't posted (drafts/<id>/draft.json →
# drafts/<id>/NN.jpg) and commits the slides, so they can be reviewed on
# GitHub before anyone sets "status": "approved". Nothing is published here.

on:
  push:
    branches: [main]
    paths: ["drafts/**/draft.json"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: draft-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & fonts
        run: |
          pip install pillow numpy fonttools -q
          mkdir -p fonts
          curl -sL -o "fonts/Cinzel.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf"
          curl -sL -o "fonts/EBGaramond.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf"

      - name: Render drafts
        run: python carousel.py render-pending

      - name: Commit slides
        run: |
          git config user.name "alloccult-bot"
          git config user.email "bot@alloccult.com"
          git add drafts
          git diff --cached --quiet || git commit -m "Render carousel drafts"
          git pull --rebase
          git push
